name: openForm Beta Release
on:
  workflow_run:
    workflows: ["openForm Android APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: APK aus erfolgreichem Android-Build herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'openForm-*-debug' --dir artifact
          APK=$(find artifact -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" openForm-beta.apk
      - name: Öffentlichen Beta-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="beta-build-${RUN_NUMBER}"
          cat > release-notes.md <<'EOF'
          ## openForm – Android-Beta für Freunde

          Testversion für Android. APK unten unter **Assets** herunterladen und installieren.

          **Wichtig:** Beta/Debug-Build, nicht für sensible Daten oder produktiven Einsatz empfohlen.
          Vor einem Update unbedingt ein Backup der Trainings- und Ernährungsdaten anlegen.
          Funktionen können fehlerhaft sein. Gym-Bilder und Animationen können aufgrund separater Lizenzrechte fehlen.

          Feedback bitte über [GitHub Issues](https://github.com/Azerusxx/openForm/issues).
          EOF
          gh release create "$TAG" openForm-beta.apk --repo "$REPO" --target "$HEAD_SHA" --title "openForm Beta – Build ${RUN_NUMBER}" --notes-file release-notes.md --prerelease --latest=false

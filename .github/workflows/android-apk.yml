name: openForm Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Projektstruktur pruefen
        shell: bash
        run: |
          set -euo pipefail
          for path in frontend/package.json frontend/package-lock.json frontend/android/gradlew frontend/android/gradle/wrapper/gradle-wrapper.jar frontend/capacitor.config.json frontend/scripts/check-mobile-bundle.mjs api/coach/core; do
            if [ ! -e "$path" ]; then
              echo "::error::Fehlt im GitHub-Repository: $path"
              exit 1
            fi
          done
          echo "Alle erforderlichen Projektdateien vorhanden."

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Ernaehrungsberechnungen testen
        working-directory: frontend
        run: node --test src/lib/nutrition.test.mjs src/lib/nutrition-extra.test.mjs

      - name: Mobile Web-App bauen
        working-directory: frontend
        env:
          VITE_MOBILE: '1'
        run: npm run build

      - name: Capacitor Android synchronisieren
        working-directory: frontend
        run: |
          npx cap sync android
          node scripts/check-mobile-bundle.mjs

      - name: Android Test-App benennen
        working-directory: frontend
        run: |
          if [ -f android/app/src/debug/res/values/strings.xml ]; then
            sed -i 's/OpenGymTest/openForm Test/g' android/app/src/debug/res/values/strings.xml
          fi

      - name: Debug APK erstellen
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: openForm-0.2.0-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

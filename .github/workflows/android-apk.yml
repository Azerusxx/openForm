name: openForm Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Projektstruktur pruefen
        shell: bash
        run: |
          set -euo pipefail
          for path in frontend/package.json frontend/package-lock.json frontend/android/gradlew frontend/android/gradle/wrapper/gradle-wrapper.jar frontend/capacitor.config.json frontend/scripts/check-mobile-bundle.mjs api/coach/core; do
            if [ ! -e "$path" ]; then
              echo "::error::Fehlt im GitHub-Repository: $path"
              exit 1
            fi
          done
          echo "Alle erforderlichen Projektdateien vorhanden."

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Frontend-Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Ernaehrung, Backup und Navigation testen
        working-directory: frontend
        run: node --test src/lib/nutrition.test.mjs src/lib/nutrition-extra.test.mjs src/components/TabBar.openform.test.mjs src/lib/openform-backup.test.mjs src/lib/openform-integrated-ui.test.mjs src/lib/backup-review.test.mjs src/lib/nutrition-navigation.test.mjs src/lib/nutrition-032.test.mjs src/lib/nutrition-micros.test.mjs src/lib/coach-nutrition.test.mjs

      - name: Mobile Web-App bauen
        working-directory: frontend
        env:
          VITE_MOBILE: '1'
        run: npm run build

      - name: Capacitor Android synchronisieren
        working-directory: frontend
        run: |
          npx cap sync android
          node scripts/check-mobile-bundle.mjs

      - name: Android Test-App benennen
        working-directory: frontend
        run: |
          if [ -f android/app/src/debug/res/values/strings.xml ]; then
            sed -i 's/OpenGymTest/openForm Test/g' android/app/src/debug/res/values/strings.xml
          fi

      # A GitHub-hosted runner is new for every workflow run. Android would otherwise
      # generate a new debug signing key each time, and refuse in-place APK upgrades.
      # Generate ONE keystore on your own PC and store its BASE64 in the repository
      # secret OPENFORM_DEBUG_KEYSTORE_B64 (never commit the keystore itself).
      - name: Stabile Debug-Signatur laden
        shell: bash
        env:
          OPENFORM_DEBUG_KEYSTORE_B64: ${{ secrets.OPENFORM_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$OPENFORM_DEBUG_KEYSTORE_B64" ]; then
            echo "::error::GitHub Secret OPENFORM_DEBUG_KEYSTORE_B64 fehlt. Anleitung: OPENFORM_UPDATE_SETUP.md"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          printf '%s' "$OPENFORM_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      # The package ID is unchanged. Android requires an identical signature and
      # a versionCode that is not lower than the installed version.
      - name: Android Build-Nummer aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          code=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${code}/" frontend/android/app/build.gradle
          echo "Baue openForm Android versionCode=${code}"

      - name: Debug APK erstellen
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: openForm-0.3.3-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
